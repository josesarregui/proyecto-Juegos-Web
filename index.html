<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos de Fiesta</title> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🕵️‍♂️</text></svg>'>
</head>
<body>

    <div class="container" id="pantallaSelectorJuegos">
        <div class="logo">🎉</div>
        <h1>Selecciona un Juego</h1>
        <p class="instruccion-pantalla">Elige un modo de juego para comenzar.</p>
        <div class="menu-opciones">
            <button id="botonJugarImpostor">Impostor 🕵️‍♂️</button>
            <button id="botonJugarEspia" class="boton-secundario" disabled>El Espía (Próximamente)</button>
            <button id="botonJugarAdivina" class="boton-secundario" disabled>Adivina la Palabra (Próximamente)</button>
        </div>
    </div>

    <div class="container oculto" id="pantallaMenuImpostor"> 
        <div class="logo">🕵️‍♂️</div> 
        <h1>¡Bienvenido!</h1>
        <p class="instruccion-pantalla">Configura tu partida de Impostor.</p>
        <div class="menu-opciones">
            <button id="botonJugarLocal">Jugar Local</button>
            <button id="botonGestionarCategorias" class="boton-secundario">Crear / Editar Categorías</button>
            <button id="botonVolverSelector" class="boton-secundario" style="margin-top: 20px;">Volver al Selector de Juegos</button>
        </div>
    </div>

    <div class="container oculto" id="pantallaConfig">
        </div>
    
    <div class="container oculto" id="pantallaGestionar">
        </div>

    <div class="container oculto" id="pantallaCrearCategoria">
        </div>

    <div class="container oculto" id="pantallaJuego">
        </div>

    <div class="container oculto" id="pantallaInicioRonda">
        </div>

    <div class="container oculto" id="pantallaFinal">
        </div>
    
    <script src="app.js"></script>
</body>
</html>
